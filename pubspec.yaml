name: nai
description: "Nevzat Ayaz Anadolu Lisesi duyuru ve haber takip uygulaması."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  html: ^0.15.4
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.3
  workmanager: ^0.5.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  url_launcher: ^6.3.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  crypto: ^3.0.5
  package_info_plus: ^8.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B0F19"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
